name: Refresh credit ratings (weekly)

on:
  schedule:
    - cron: "30 4 * * 1" # Mondays 10:00 Sri Lanka time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  ratings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh ratings
        run: python -m scrapers.ratings
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update credit ratings $(TZ=Asia/Colombo date +%F)"
          git pull --rebase
          git push
