name: Scrape rates (daily)

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 Sri Lanka time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape fixed deposit rates
        run: python -m scrapers.run
      - name: Update CBSL ceiling and check for new CBSL directions
        run: python -m scrapers.cbsl
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update rates $(TZ=Asia/Colombo date +%F)"
          git pull --rebase
          git push
      - name: Fail (and notify) if CBSL has published a new deposit-rate direction
        run: python -m scrapers.cbsl --alert
